<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>Horas Sociales · Mi Agenda</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --sky-50:#f0f9ff; --sky-100:#e0f2fe; --sky-200:#bae6fd; --sky-300:#7dd3fc;
    --sky-400:#38bdf8; --sky-500:#0ea5e9; --sky-600:#0284c7; --sky-700:#0369a1;
    --navy-800:#075985; --navy-900:#0c4a6e; --ink:#0f2f44; --slate:#5b6b7c;
    --card:#ffffff; --card-brd:#e6f0f9; --radius:22px; --maxw:640px;
    --green-500:#22c55e; --amber-500:#f59e0b; --red-400:#f87171;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth;overflow-x:hidden}
  body{
    font-family:'Segoe UI',Inter,-apple-system,system-ui,sans-serif;
    color:var(--ink);background:#ffffff;position:relative;overflow-x:hidden;
    min-height:100dvh;
    padding:0 0 calc(150px + env(safe-area-inset-bottom));
  }

  /* ---------- ondas EXACTAS del dashboard ---------- */
  .flow-field{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:visible}
  .flow-field svg{width:100%;height:100%;overflow:visible}
  .wf-l{fill:none;stroke-width:0.9;vector-effect:non-scaling-stroke}
  .wiggle{animation:flow-drift 38s ease-in-out infinite;will-change:transform}
  @keyframes flow-drift{0%,100%{transform:translate(0,0)}20%{transform:translate(9px,-16px)}45%{transform:translate(19px,-6px)}70%{transform:translate(11px,6px)}}

  .wrap{max-width:var(--maxw);margin:0 auto;padding:22px 18px 10px;position:relative;z-index:1}
  @media (min-width:720px){ :root{--maxw:920px} .wrap{padding:30px 26px 12px} }

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:14px;padding:4px 2px 18px}
  .avatar{width:56px;height:56px;border-radius:50%;flex:0 0 auto;position:relative;
    filter:drop-shadow(0 8px 16px rgba(14,165,233,.35))}
  .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
  .avatar svg{width:100%;height:100%;display:block}
  .avatar::after{content:'';position:absolute;inset:-3px;border-radius:50%;
    border:2.5px solid rgba(56,189,248,.45)}
  .hi{flex:1;min-width:0}
  .hi h1{font-size:22px;font-weight:800;color:var(--navy-900);letter-spacing:-.2px}
  .hi p{font-size:12.5px;color:var(--slate);font-weight:600;margin-top:3px}
  .logout{display:flex;align-items:center;gap:7px;text-decoration:none;
    background:var(--sky-50);border:1px solid var(--sky-200);color:var(--sky-700);
    padding:9px 13px;border-radius:999px;font-weight:800;font-size:12px;
    transition:background .2s,box-shadow .2s,transform .12s;white-space:nowrap}
  .logout:hover{background:var(--sky-100);box-shadow:0 4px 12px rgba(2,132,199,.18)}
  .logout:active{transform:scale(.96)}
  .logout .material-symbols-outlined{font-size:18px}
  @media (max-width:430px){ .logout small{display:none} .logout{padding:10px} }

  /* ---------- card base ---------- */
  .card{
    background:var(--card);border:1px solid var(--card-brd);
    border-radius:var(--radius);padding:18px;margin-bottom:16px;
    box-shadow:0 12px 30px rgba(3,105,161,.10);
  }

  /* ---------- segmented control vistas ---------- */
  .seg{display:flex;background:var(--sky-100);border:1px solid var(--sky-200);
    border-radius:14px;padding:4px;margin-bottom:16px;gap:4px}
  .seg-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;
    border:0;background:transparent;padding:9px 4px;border-radius:11px;
    font-weight:700;font-size:12px;color:var(--slate);cursor:pointer;
    transition:background .15s,color .15s,box-shadow .15s}
  .seg-btn .material-symbols-outlined{font-size:17px}
  .seg-btn.active{background:linear-gradient(135deg,var(--sky-500),var(--sky-600));
    color:#fff;box-shadow:0 4px 12px rgba(2,132,199,.30)}
  @media (max-width:430px){ .seg-btn{font-size:11px} .seg-btn .material-symbols-outlined{font-size:16px} }

  /* ---------- barra de fecha ---------- */
  .datebar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .datebar .dnav{width:38px;height:38px;border-radius:50%;border:1px solid var(--card-brd);
    background:var(--sky-50);display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--sky-600);font-weight:700;transition:background .15s,transform .1s;
    flex:0 0 auto}
  .datebar .dnav:hover{background:var(--sky-100)}
  .datebar .dnav:active{transform:scale(.9)}
  .datebar .dnav .material-symbols-outlined{font-size:20px}
  .datebar .dlabel{flex:1;text-align:center;font-size:14.5px;font-weight:800;color:var(--navy-900);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .datebar input[type=date]{
    font:inherit;font-weight:700;font-size:12px;color:var(--sky-700);
    background:var(--sky-50);border:1px solid var(--sky-200);border-radius:10px;
    padding:7px 8px;flex:0 0 auto;max-width:142px;cursor:pointer}
  .datebar input[type=date]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.7}

  /* ---------- calendario mes ---------- */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px 2px;text-align:center;justify-items:center}
  .cal-dh{font-size:10.5px;font-weight:700;color:var(--slate);text-transform:uppercase;padding:6px 0}
  .cal-dh.weekend{color:var(--sky-500)}
  .cal-d{position:relative;width:40px;height:40px;display:flex;align-items:center;justify-content:center;
    border-radius:50%;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;
    transition:background .12s,transform .1s}
  .cal-d:hover{background:var(--sky-50)}
  .cal-d:active{transform:scale(.88)}
  .cal-d.empty{cursor:default}
  .cal-d.empty:hover{background:transparent}
  .cal-d.next-month{color:var(--sky-200);cursor:default}
  .cal-d.next-month:hover{background:transparent}
  .cal-d.today{background:var(--sky-400);color:#fff;font-weight:800;
    box-shadow:0 4px 14px rgba(14,165,233,.35)}
  .cal-d.today:hover{background:var(--sky-500)}
  .cal-d.selected:not(.today){background:var(--sky-100);color:var(--sky-700);font-weight:800}
  .cal-d.has-event::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
    width:5px;height:5px;border-radius:50%;background:var(--sky-500)}
  .cal-d.today.has-event::after{background:#fff}
  .cal-d.done-only::after{background:var(--slate);opacity:.5}
  .cal-d.pending::after{background:var(--amber-500);opacity:.9}
  .cal-d.multi.has-event::after{display:none}
  .cal-d .cnt{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 3px;
    border-radius:999px;background:var(--navy-900);color:#fff;font-size:9px;font-weight:800;
    display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;line-height:1}
  .cal-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .cal-stats{font-size:11.5px;color:var(--slate);font-weight:700;line-height:1.45}
  .cal-stats b{color:var(--navy-900)}
  .cal-today-btn{font:inherit;font-weight:800;font-size:11.5px;color:var(--sky-600);
    background:var(--sky-50);border:1px solid var(--sky-200);border-radius:999px;
    padding:7px 13px;cursor:pointer;transition:background .15s,transform .1s;display:flex;
    align-items:center;gap:5px;white-space:nowrap}
  .cal-today-btn:hover{background:var(--sky-100)}
  .cal-today-btn:active{transform:scale(.94)}
  .cal-today-btn .material-symbols-outlined{font-size:16px}
  .cal-legend{display:flex;justify-content:center;gap:16px;margin-top:12px;font-size:11px;
    font-weight:700;color:var(--slate)}
  .cal-legend span{display:flex;align-items:center;gap:5px}
  .cal-legend i{width:7px;height:7px;border-radius:50%;display:inline-block}

  /* ---------- vista semana ---------- */
  .week-day{display:flex;align-items:center;gap:10px;padding:11px 12px;margin-bottom:8px;
    background:var(--card);border:1px solid var(--card-brd);border-radius:14px;
    cursor:pointer;transition:box-shadow .12s,transform .1s}
  .week-day:active{transform:scale(.98)}
  .week-day .wd-pill{width:44px;height:44px;border-radius:12px;flex:0 0 auto;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--sky-50);color:var(--sky-700)}
  .week-day.active .wd-pill{background:var(--sky-400);color:#fff}
  .week-day .wd-num{font-size:16px;font-weight:800;line-height:1}
  .week-day .wd-name{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px}
  .week-day .wd-info{flex:1;min-width:0}
  .week-day .wd-info b{display:block;font-size:12.5px;color:var(--ink)}
  .week-day .wd-info small{font-size:11px;color:var(--slate);font-weight:600}
  .week-day .wd-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .wd-dot.blue{background:var(--sky-500)} .wd-dot.green{background:var(--green-500)}
  .wd-dot.amber{background:var(--amber-500)} .wd-dot.gray{background:var(--card-brd)}

  /* ---------- vista año ---------- */
  .yr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media (min-width:560px){ .yr-grid{grid-template-columns:repeat(4,1fr)} }
  .yr-cell{background:var(--card);border:1px solid var(--card-brd);border-radius:16px;
    padding:15px 8px 12px;cursor:pointer;text-align:center;position:relative;
    transition:box-shadow .12s,transform .1s,border-color .12s}
  .yr-cell:hover{box-shadow:0 6px 16px rgba(3,105,161,.10)}
  .yr-cell:active{transform:scale(.96)}
  .yr-cell.active{background:linear-gradient(135deg,var(--sky-500),var(--sky-600));
    border-color:transparent;box-shadow:0 8px 20px rgba(2,132,199,.28)}
  .yr-cell.active b{color:#fff}
  .yr-cell.active .yr-count{background:rgba(255,255,255,.22);color:#fff}
  .yr-cell b{display:block;font-size:13px;font-weight:800;color:var(--navy-900);
    text-transform:capitalize;margin-bottom:8px;letter-spacing:.1px}
  .yr-cell .yr-count{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;
    color:var(--sky-600);background:var(--sky-50);border-radius:999px;padding:3px 9px}
  .yr-cell .yr-count.none{color:var(--slate);background:transparent;border:1px dashed var(--sky-200)}
  .yr-cell .yr-count i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}

  /* ---------- lista de eventos ---------- */
  .ev-list{margin-top:2px}
  .ev-card{display:flex;gap:13px;align-items:flex-start;
    background:var(--card);border:1px solid var(--card-brd);
    border-radius:16px;padding:14px;margin-bottom:10px;
    box-shadow:0 4px 14px rgba(3,105,161,.07);transition:transform .12s}
  .ev-card:active{transform:scale(.98)}
  .ev-icon{width:42px;height:42px;border-radius:50%;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;color:#fff}
  .ev-icon.blue{background:var(--navy-900)}
  .ev-icon.green{background:var(--green-500)}
  .ev-icon.amber{background:var(--amber-500)}
  .ev-icon.gray{background:var(--slate)}
  .ev-body{flex:1;min-width:0}
  .ev-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .ev-body h4{font-size:14px;font-weight:700;color:var(--ink)}
  .ev-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--slate);margin-top:3px}
  .ev-row .material-symbols-outlined{font-size:14px;color:var(--sky-500)}
  .ev-pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.3px;
    padding:3px 9px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
  .ev-pill.done{background:var(--sky-100);color:var(--sky-700)}
  .ev-pill.active{background:var(--green-500);color:#fff}
  .ev-pill.pending{background:#fef3c7;color:#92400e}
  .ev-empty{text-align:center;padding:28px 14px;color:var(--slate);font-size:13.5px;font-weight:600;
    background:var(--card);border:1px dashed var(--card-brd);border-radius:16px}
  .ev-empty .material-symbols-outlined{font-size:38px;color:var(--sky-200);display:block;margin:0 auto 8px}

  /* ---------- todas las actividades ---------- */
  .all-summary{display:flex;flex-direction:column;gap:9px;
    background:linear-gradient(135deg,#f0f9ff,#e6f4fe);
    border:1px solid var(--sky-200);border-radius:16px;padding:14px 16px;margin-bottom:16px}
  .all-summary .as-top{display:flex;justify-content:space-between;align-items:center;
    font-size:12.5px;font-weight:700;color:var(--navy-900)}
  .all-summary .as-top b{font-size:14.5px}
  .all-summary .as-bar{height:8px;border-radius:999px;background:var(--sky-100);overflow:hidden}
  .all-summary .as-bar i{display:block;height:100%;border-radius:999px;
    background:linear-gradient(90deg,var(--sky-400),var(--sky-600));transition:width .5s ease}
  .all-summary .as-sub{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;color:var(--slate)}
  .all-row{display:flex;gap:11px;align-items:center;padding:10px 12px;margin-bottom:7px;
    background:var(--card);border:1px solid var(--card-brd);border-radius:13px}
  .all-row .slot{display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--sky-50);border-radius:11px;flex:0 0 auto;min-width:48px;height:46px}
  .all-row .slot b{font-size:15px;font-weight:800;color:var(--sky-600);line-height:1.15}
  .all-row .slot small{font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--slate)}
  .all-row .all-t{flex:1;min-width:0}
  .all-row .all-t b{display:block;font-size:12.5px;color:var(--ink);font-weight:700}
  .all-row .all-t small{font-size:11px;color:var(--slate);font-weight:600;text-transform:capitalize}
  .all-row .all-h{font-size:11.5px;font-weight:800;color:var(--sky-700);flex:0 0 auto}
  .all-row .all-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .all-dot.pending{background:var(--amber-500)}
  .all-dot.done{background:var(--sky-200)}
  .all-dot.active{background:var(--green-500)}
  .all-row.next{border-color:var(--sky-300);box-shadow:0 4px 12px rgba(2,132,199,.10)}
  .next-pill{font-size:8.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
    color:var(--sky-600);background:var(--sky-50);border:1px solid var(--sky-200);
    border-radius:999px;padding:2px 7px;flex:0 0 auto;white-space:nowrap}
  .all-summary .as-actions{display:flex;align-items:center;gap:8px}
  .as-btn{display:inline-flex;align-items:center;gap:5px;font:inherit;font-weight:800;font-size:11px;
    color:#fff;background:linear-gradient(135deg,var(--sky-500),var(--sky-600));border:0;
    border-radius:999px;padding:7px 12px;cursor:pointer;box-shadow:0 4px 10px rgba(2,132,199,.25);
    transition:box-shadow .15s,transform .1s;white-space:nowrap}
  .as-btn .material-symbols-outlined{font-size:15px}
  .as-btn:hover{box-shadow:0 6px 14px rgba(2,132,199,.35)}
  .as-btn:active{transform:scale(.94)}

  /* ---------- pestañas hoy / pendientes / realizadas ---------- */
  .all-tabs{display:flex;gap:6px;background:var(--sky-100);border:1px solid var(--sky-200);
    border-radius:14px;padding:4px;margin-bottom:14px}
  .all-tab{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
    border:0;background:transparent;padding:9px 4px;border-radius:11px;
    font-weight:800;font-size:11.5px;color:var(--slate);cursor:pointer;min-width:0;
    transition:background .15s,color .15s,box-shadow .15s;white-space:nowrap}
  .all-tab .material-symbols-outlined{font-size:16px;flex:0 0 auto}
  .all-tab .tab-count{font-size:10px;font-weight:800;background:var(--sky-200);color:var(--sky-700);
    border-radius:999px;padding:1px 7px;transition:background .15s,color .15s}
  .all-tab.active{background:linear-gradient(135deg,var(--sky-500),var(--sky-600));color:#fff;
    box-shadow:0 4px 12px rgba(2,132,199,.30)}
  .all-tab.active .tab-count{background:rgba(255,255,255,.25);color:#fff}
  @media (max-width:430px){ .all-tab{font-size:10.5px;gap:3px} .all-tab .material-symbols-outlined{font-size:15px} }

  /* ---------- nav inferior glass (misma barra que el dashboard) ---------- */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:rgba(255,255,255,.92);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-top:1px solid #eaf3fb;box-shadow:0 -8px 26px rgba(3,105,161,.12);
    border-radius:24px 24px 0 0;
    padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
  .nav-inner{max-width:var(--maxw);margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);
    column-gap:4px;padding:0 2px}
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;
    border-radius:15px;text-decoration:none;color:var(--slate);font-size:10px;font-weight:700;min-width:0;
    transition:transform .12s,color .2s}
  .nav-item:active{transform:scale(.92)}
  .nav-item .ic{width:48px;height:36px;display:flex;align-items:center;justify-content:center;
    border-radius:13px;transition:background .2s,color .2s;color:#94a3b8}
  .nav-item .ic .material-symbols-outlined{font-size:23px}
  .nav-item small{font-size:10.5px;font-weight:700;letter-spacing:.2px}
  .nav-item.active{color:var(--navy-900)}
  .nav-item.active .ic{background:var(--navy-900);color:#fff}

  .material-symbols-outlined{
    font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;
    user-select:none;
  }

  /* ---------- toast ---------- */
  #toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--navy-900);color:#fff;padding:10px 22px;border-radius:999px;
    font-size:13px;font-weight:700;opacity:0;transition:opacity .25s,transform .25s;
    pointer-events:none;z-index:100;white-space:nowrap;box-shadow:0 6px 20px rgba(12,74,110,.3)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- modal informe ---------- */
  .modal-mask{position:fixed;inset:0;z-index:120;background:rgba(15,47,68,.45);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;
    transition:opacity .22s,visibility .22s}
  .modal-mask.open{opacity:1;visibility:visible}
  .modal{width:100%;max-width:560px;max-height:82dvh;display:flex;flex-direction:column;
    background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -14px 40px rgba(3,105,161,.25);
    transform:translateY(40px);transition:transform .25s ease;overflow:hidden}
  .modal-mask.open .modal{transform:translateY(0)}
  @media (min-width:720px){
    .modal-mask{align-items:center;padding:20px}
    .modal{border-radius:24px;transform:translateY(24px) scale(.96)}
    .modal-mask.open .modal{transform:translateY(0) scale(1)}
  }
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:16px 18px 14px;border-bottom:1px solid var(--card-brd);flex:0 0 auto}
  .mh-title{display:flex;align-items:center;gap:11px;min-width:0}
  .mh-title .material-symbols-outlined{font-size:26px;color:var(--sky-500);flex:0 0 auto}
  .mh-title h3{font-size:16.5px;font-weight:800;color:var(--navy-900)}
  .mh-title small{font-size:11px;color:var(--slate);font-weight:600}
  .mh-close{width:34px;height:34px;border-radius:50%;border:1px solid var(--card-brd);
    background:var(--sky-50);color:var(--slate);display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:background .15s,transform .1s;flex:0 0 auto}
  .mh-close:hover{background:var(--sky-100)}
  .mh-close:active{transform:scale(.9)}
  .mh-close .material-symbols-outlined{font-size:19px}
  .modal-body{padding:14px 18px 22px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
  .rep-summary{display:flex;gap:10px;margin-bottom:16px}
  .rep-stat{flex:1;background:linear-gradient(135deg,#f0f9ff,#e6f4fe);border:1px solid var(--sky-200);
    border-radius:14px;padding:12px 10px;text-align:center}
  .rep-stat b{display:block;font-size:17px;font-weight:800;color:var(--navy-900)}
  .rep-stat small{font-size:9.5px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.4px}
  .rep-month{margin-bottom:15px}
  .rep-month h4{font-size:13px;font-weight:800;color:var(--navy-900);text-transform:capitalize;

    {d:'2026-09-10', h:'08:00 – 10:00', title:'Entrega de donaciones', loc:'Sede comunal Barrio Norte', icon:'volunteer_activism', color:'amber', status:'pending', hours:2},
    {d:'2026-09-12', h:'09:00 – 11:00', title:'Huerta escolar', loc:'Terraza del colegio', icon:'yard', color:'green', status:'pending', hours:2},
    {d:'2026-09-15', h:'08:00 – 12:00', title:'Primeros auxilios', loc:'Salón de salud', icon:'first_health', color:'amber', status:'pending', hours:4},
    {d:'2026-09-17', h:'08:00 – 10:00', title:'Lectura a primaria', loc:'IEP San Martín', icon:'auto_stories', color:'blue', status:'pending', hours:2},
    {d:'2026-09-19', h:'09:00 – 11:00', title:'Reforestación', loc:'Cerro del Este', icon:'forest', color:'green', status:'pending', hours:2},
    {d:'2026-09-22', h:'08:00 – 12:00', title:'Apadrinamiento de lectura', loc:'Biblioteca escolar', icon:'rate_review', color:'blue', status:'pending', hours:4},
    {d:'2026-09-24', h:'08:00 – 10:00', title:'Donación de útiles', loc:'Sede comunal Barrio Norte', icon:'school', color:'amber', status:'pending', hours:2},
    {d:'2026-09-26', h:'09:00 – 11:00', title:'Mural comunitario', loc:'Plaza del barrio', icon:'brush', color:'blue', status:'pending', hours:2},
    {d:'2026-09-29', h:'08:00 – 12:00', title:'Jornada ambiental', loc:'Parque ecológico', icon:'eco', color:'green', status:'pending', hours:4},
    {d:'2026-10-01', h:'08:00 – 10:00', title:'Campaña de reciclaje', loc:'Zona verde del campus', icon:'recycling', color:'green', status:'pending', hours:2},
    {d:'2026-10-03', h:'09:00 – 11:00', title:'Huerta escolar', loc:'Terraza del colegio', icon:'yard', color:'green', status:'pending', hours:2},
    {d:'2026-10-06', h:'08:00 – 12:00', title:'Biblioteca escolar', loc:'Biblioteca Alfredo Correa', icon:'menu_book', color:'blue', status:'pending', hours:4},
    {d:'2026-10-08', h:'08:00 – 10:00', title:'Jornada de clausura', loc:'Auditorio principal', icon:'celebration', color:'amber', status:'pending', hours:2},
    // ---------- SUSTENTACIONES DE RECUPERACIÓN ACADÉMICA ----------
    {d:'2026-10-31', h:'10:00 – 11:30', title:'Sustentación: Química Orgánica (Nivelación)', loc:'Laboratorio 102 · Dra. Laura Gómez', icon:'menu_book', color:'blue', status:'pending', hours:0},
    {d:'2026-11-04', h:'08:30 – 10:00', title:'Sustentación: Matemáticas 11° (Nivelación)', loc:'Aula 204 · Lic. Carlos Mario Restrepo', icon:'menu_book', color:'amber', status:'pending', hours:0},
    {d:'2026-11-10', h:'11:30 – 12:30', title:'Sustentación: Lengua Castellana (Nivelación)', loc:'Biblioteca Central · Lic. Andrés Beltrán', icon:'menu_book', color:'blue', status:'pending', hours:0}
  ];

  var MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var MONTHS_SHORT = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  var DAYS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  var DAYS_SHORT = ['Do','Lu','Ma','Mi','Ju','Vi','Sa'];
  var STATUS_LABEL = {done:'Realizada',active:'En curso',pending:'Pendiente'};
  var STATUS_PILL = {done:'done',active:'active',pending:'pending'};

  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function iso(dt){ return dt.getFullYear() + '-' + pad(dt.getMonth()+1) + '-' + pad(dt.getDate()); }
  function parseISO(s){ var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  // fecha base del cursor (para navegar vistas)
  var cursor = parseISO('2026-09-08');
  var view = 'mes';

  function evOn(d){ return events.filter(function(e){ return e.d === d; }); }
  function soonestStatus(dd){
    var evs = evOn(dd);
    if (!evs.length) return null;
    if (evs.some(function(e){ return e.status === 'active'; })) return 'active';
    if (evs.some(function(e){ return e.status === 'pending'; })) return 'pending';
    return 'done';
  }

  /* ================= helpers UI ================= */
  function evCardHTML(e){
    return '<div class="ev-card">' +
      '<div class="ev-icon ' + e.color + '"><span class="material-symbols-outlined" style="font-size:21px">' + e.icon + '</span></div>' +
      '<div class="ev-body">' +
        '<div class="ev-top"><h4>' + e.title + '</h4>' +
        '<span class="ev-pill ' + STATUS_PILL[e.status] + '">' + STATUS_LABEL[e.status] + '</span></div>' +
        '<div class="ev-row"><span class="material-symbols-outlined">schedule</span>' + e.h + '</div>' +
        '<div class="ev-row"><span class="material-symbols-outlined">location_on</span>' + e.loc + '</div>' +
      '</div></div>';
  }
  function evEmptyHTML(msg){
    return '<div class="ev-empty"><span class="material-symbols-outlined">event_busy</span>' + msg + '</div>';
  }
  function fmtLong(dt){
    return DAYS[dt.getDay()] + ' ' + dt.getDate() + ' de ' + MONTHS[dt.getMonth()];
  }

  /* ================= vistas ================= */
  function setView(v){
    view = v;
    document.querySelectorAll('.seg-btn').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-view') === v);
    });
    $('viewMes').style.display = (v === 'mes') ? '' : 'none';
    $('viewSemana').style.display = (v === 'semana') ? '' : 'none';
    $('viewDia').style.display = (v === 'dia') ? '' : 'none';
    $('viewAno').style.display = (v === 'ano') ? '' : 'none';
    render();
  }

  function render(){
    var dt = cursor;
    if (view === 'mes') { $('dLabel').textContent = MONTHS[dt.getMonth()].charAt(0).toUpperCase() + MONTHS[dt.getMonth()].slice(1) + ' ' + dt.getFullYear(); renderMes(); }
    else if (view === 'semana') { $('dLabel').textContent = 'Semana del ' + dt.getDate() + ' ' + MONTHS_SHORT[dt.getMonth()]; renderSemana(); }
    else if (view === 'dia') { $('dLabel').textContent = fmtLong(dt); renderDia(); }
    else { $('dLabel').textContent = 'Año ' + dt.getFullYear(); renderAno(); }
    renderAllLists();
  }

  /* -------- mes -------- */
  function renderMes(){
    var y = cursor.getFullYear(), m = cursor.getMonth();
    var grid = $('calGrid'); grid.innerHTML = '';
    // estadísticas del mes visible
    var monthEvents = events.filter(function(e){ return e.d.indexOf(y + '-' + pad(m+1)) === 0; });
    var hReal = 0, hPend = 0;
    monthEvents.forEach(function(e){
      if (e.status === 'done') hReal += e.hours; else if (e.status === 'active') hReal += e.hours; else hPend += e.hours;
    });
    $('calStats').innerHTML = '<b>' + monthEvents.length + '</b> actividades · <b>' + hReal + ' h</b> hechas · <b>' + hPend + ' h</b> por hacer';
    DAYS_SHORT.forEach(function(d, i){
      var el = document.createElement('div');
      el.className = 'cal-dh' + (i >= 5 ? ' weekend' : '');
      el.textContent = d;
      grid.appendChild(el);
    });
    var total = new Date(y, m+1, 0).getDate();
    var start = new Date(y, m, 1).getDay();
    var prevTotal = new Date(y, m, 0).getDate();
    for (var p = start - 1; p >= 0; p--){
      var el = document.createElement('div');
      el.className = 'cal-d next-month';
      el.textContent = prevTotal - p;
      grid.appendChild(el);
    }
    for (var d = 1; d <= total; d++){
      var ds = iso(new Date(y, m, d));
      var cls = 'cal-d';
      var st = soonestStatus(ds);
      var cnt = evOn(ds).length;
      if (ds < TODAY) cls += ' past';
      if (ds === TODAY) cls += ' today';
      if (ds === iso(cursor) && ds !== TODAY) cls += ' selected';
      if (st) cls += ' has-event';
      if (st === 'done') cls += ' done-only';
      if (st === 'pending') cls += ' pending';
      if (cnt >= 2) cls += ' multi';
      var el = document.createElement('div');
      el.className = cls;
      el.textContent = d;
      el.setAttribute('data-ds', ds);
      if (cnt >= 2){
        var badge = document.createElement('span');
        badge.className = 'cnt';
        badge.textContent = cnt;
        el.appendChild(badge);
      }
      el.addEventListener('click', function(){ cursor = parseISO(this.getAttribute('data-ds')); renderMes(); renderMesEvents(); });
      grid.appendChild(el);
    }
    var filled = start + total, nx = 1;
    while (filled < 42){
      var el = document.createElement('div');
      el.className = 'cal-d next-month';
      el.textContent = nx++;
      grid.appendChild(el); filled++;
    }
    renderMesEvents();
  }
  function renderMesEvents(){
    var box = $('mesEvents'); box.innerHTML = '';
    var evs = evOn(iso(cursor));
    if (!evs.length){ box.innerHTML = evEmptyHTML('Sin actividades este día'); return; }
    evs.forEach(function(e){ box.innerHTML += evCardHTML(e); });
  }

  /* -------- semana -------- */
  function renderSemana(){
    var box = $('weekDays'); box.innerHTML = '';
    var monday = new Date(cursor);
    var diff = (cursor.getDay() + 6) % 7; // 0=lunes
    monday.setDate(cursor.getDate() - diff);
    var days = [];
    for (var i = 0; i < 7; i++){
      var dt = new Date(monday); dt.setDate(monday.getDate() + i);
      days.push(dt);
    }
    var todayIdx = days.findIndex(function(dt){ return dt.getDay() === 1; }); // placeholder
    days.forEach(function(dt){
      var ds = iso(dt);
      var st = soonestStatus(ds);
      var el = document.createElement('div');
      el.className = 'week-day' + (ds === iso(cursor) ? ' active' : '');
      var dot = st ? '<span class="wd-dot ' + (st === 'done' ? 'blue' : st === 'active' ? 'green' : 'amber') + '"></span>' : '<span class="wd-dot gray"></span>';
      el.innerHTML =
        '<div class="wd-pill"><span class="wd-num">' + dt.getDate() + '</span><span class="wd-name">' + DAYS_SHORT[dt.getDay()] + '</span></div>' +
        '<div class="wd-info"><b>' + (ds === TODAY ? 'Hoy' : DAYS[dt.getDay()]) + '</b>' +
        '<small>' + (st ? (st === 'done' ? 'Realizada' : st === 'active' ? 'En curso' : 'Pendiente') : 'Sin actividades') + '</small></div>' +
        dot;
      el.addEventListener('click', (function(ds){ return function(){ cursor = parseISO(ds); render(); }; })(ds));
      box.appendChild(el);
    });

    var evs = evOn(iso(cursor));
    var eb = $('semanaEvents'); eb.innerHTML = '';
    if (!evs.length){ eb.innerHTML = evEmptyHTML('Sin actividades el ' + fmtLong(cursor)); return; }
    evs.forEach(function(e){ eb.innerHTML += evCardHTML(e); });
  }

  /* -------- día -------- */
  function renderDia(){
    var box = $('diaEvents'); box.innerHTML = '';
    var evs = evOn(iso(cursor));
    if (!evs.length){ box.innerHTML = evEmptyHTML('Sin actividades el ' + fmtLong(cursor)); return; }
    evs.forEach(function(e){ box.innerHTML += evCardHTML(e); });
  }

  /* -------- año -------- */
  function renderAno(){
    var y = cursor.getFullYear();
    var grid = $('yrGrid'); grid.innerHTML = '';
    for (var m = 0; m < 12; m++){
      var count = events.filter(function(e){ return e.d.indexOf(y + '-' + pad(m+1)) === 0; }).length;
      var el = document.createElement('div');
      el.className = 'yr-cell' + (m === cursor.getMonth() ? ' active' : '');
      el.innerHTML = '<b>' + MONTHS[m] + '</b>' +
        (count ? '<span class="yr-count"><i></i>' + count + '</span>' : '<span class="yr-count none">—</span>');
      el.addEventListener('click', (function(mm){ return function(){ cursor = new Date(y, mm, 1); setView('mes'); }; })(m));
      grid.appendChild(el);
    }
  }

  /* ================= todas las actividades ================= */
  var activeTab = 'hoy';
  function setTab(t){
    activeTab = t;
    document.querySelectorAll('.all-tab').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-tab') === t);
    });
    $('todayList').style.display = (t === 'hoy') ? '' : 'none';
    $('pendList').style.display = (t === 'pend') ? '' : 'none';
    $('doneList').style.display = (t === 'done') ? '' : 'none';
  }
  document.querySelectorAll('.all-tab').forEach(function(b){
    b.addEventListener('click', function(){ setTab(b.getAttribute('data-tab')); });
  });

  function renderAllLists(){
    var today = events.filter(function(e){ return e.d === TODAY; });
    var pend = events.filter(function(e){ return e.status === 'pending'; })
      .sort(function(a, b){ return a.d < b.d ? -1 : 1; });
    var done = events.filter(function(e){ return e.status === 'done'; })
      .sort(function(a, b){ return a.d > b.d ? -1 : 1; });
    $('todayCount').textContent = today.length;
    $('pendCount').textContent = pend.length;
    $('doneCount').textContent = done.length;
    var th = $('todayList'), ph = $('pendList'), dh = $('doneList');
    th.innerHTML = ''; ph.innerHTML = ''; dh.innerHTML = '';
    if (!today.length) th.innerHTML = evEmptyHTML('Hoy no tenés actividades programadas');
    else today.forEach(function(e){ th.innerHTML += evCardHTML(e); });
    if (!pend.length) ph.innerHTML = evEmptyHTML('No tenés actividades pendientes 🎉');
    else pend.forEach(function(e, i){ ph.innerHTML += rowHTML(e, i === 0); });
    if (!done.length) dh.innerHTML = evEmptyHTML('Todavía no realizaste ninguna actividad');
    else done.forEach(function(e){ dh.innerHTML += rowHTML(e, false); });
    // resumen de progreso
    var hHechas = 0, hPor = 0;
    done.forEach(function(e){ hHechas += e.hours; });
    today.forEach(function(e){ hHechas += e.hours; });
    pend.forEach(function(e){ hPor += e.hours; });
    var pct = (hHechas + hPor) > 0 ? Math.round(hHechas / (hHechas + hPor) * 100) : 0;
    $('allSummary').innerHTML =
      '<div class="as-top"><span>Progreso total</span><div class="as-actions"><b>' + hHechas + ' h</b>' +
      '<button class="as-btn" id="reportBtn"><span class="material-symbols-outlined">description</span>Informe</button></div></div>' +
      '<div class="as-bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="as-sub"><span>' + done.length + ' actividades · ' + hHechas + ' h acumuladas</span><span>' + hPor + ' h por hacer</span></div>';
    var rb = $('reportBtn');
    if (rb) rb.addEventListener('click', openReport);
    setTab(activeTab);
  }
  function rowHTML(e, isNext){
    var dt = parseISO(e.d);
    var dot = e.status === 'active' ? 'active' : e.status === 'pending' ? 'pending' : 'done';
    var next = isNext ? '<span class="next-pill">Próxima</span>' : '';
    return '<div class="all-row' + (isNext ? ' next' : '') + '">' +
      '<span class="slot"><b>' + dt.getDate() + '</b><small>' + MONTHS_SHORT[dt.getMonth()] + '</small></span>' +
      '<div class="all-t"><b>' + e.title + '</b><small>' + e.h + ' · ' + DAYS[dt.getDay()] + '</small></div>' +
      '<span class="all-h">' + e.hours + ' h</span>' + next +
      '<span class="all-dot ' + dot + '"></span></div>';
  }

  /* ================= informe ================= */
  function renderReport(){
    var doneS = events.filter(function(e){ return e.status === 'done'; })
      .sort(function(a, b){ return a.d < b.d ? -1 : 1; });
    var hTotal = 0;
    doneS.forEach(function(e){ hTotal += e.hours; });
    var hLive = 0, hPend = 0;
    events.forEach(function(e){
      if (e.status === 'active') hLive += e.hours;
      else if (e.status === 'pending') hPend += e.hours;
    });
    var pct = (hTotal + hLive + hPend) > 0 ? Math.round((hTotal + hLive) / (hTotal + hLive + hPend) * 100) : 0;
    var groups = [];
    doneS.forEach(function(e){
      var k = e.d.slice(0, 7);
      var g = groups.find(function(x){ return x.k === k; });
      if (!g){ g = { k: k, items: [], h: 0 }; groups.push(g); }
      g.items.push(e); g.h += e.hours;
    });
    var html =
      '<div class="rep-summary">' +
        '<div class="rep-stat"><b>' + doneS.length + '</b><small>Realizadas</small></div>' +
        '<div class="rep-stat"><b>' + hTotal + ' h</b><small>Completadas</small></div>' +
        '<div class="rep-stat"><b>' + pct + '%</b><small>Progreso</small></div>' +
      '</div>';
    if (!doneS.length){
      html += '<div class="ev-empty"><span class="material-symbols-outlined">event_busy</span>Todavía no realizaste ninguna actividad</div>';
    } else {
      groups.forEach(function(g){
        var dt = parseISO(g.k + '-01');
        html += '<div class="rep-month"><h4>' + MONTHS[dt.getMonth()] + ' ' + dt.getFullYear() + '<span>' + g.h + ' h</span></h4>';
        g.items.forEach(function(e){
          var d = parseISO(e.d);
          html += '<div class="rep-row"><span class="rd">' + pad(d.getDate()) + '/' + pad(d.getMonth()+1) + '</span>' +
            '<span class="rt">' + e.title + '</span><span class="rh">' + e.hours + ' h</span></div>';
        });
        html += '</div>';
      });
    }
    html += '<div class="rep-foot">' + hLive + ' h en curso hoy · ' + hPend + ' h pendientes por hacer</div>';
    $('reportBody').innerHTML = html;
  }
  function openReport(){
    renderReport();
    $('reportModal').classList.add('open');
    $('reportModal').setAttribute('aria-hidden', 'false');
  }
  function closeReport(){
    $('reportModal').classList.remove('open');
    $('reportModal').setAttribute('aria-hidden', 'true');
  }
  $('reportClose').addEventListener('click', closeReport);
  $('reportModal').addEventListener('click', function(e){ if (e.target === $('reportModal')) closeReport(); });

  /* ================= navegación/fecha ================= */
  document.querySelectorAll('.seg-btn').forEach(function(b){
    b.addEventListener('click', function(){ setView(b.getAttribute('data-view')); });
  });
  $('dPrev').addEventListener('click', function(){
    var d = new Date(cursor);
    if (view === 'dia') d.setDate(d.getDate() - 1);
    else if (view === 'semana') d.setDate(d.getDate() - 7);
    else if (view === 'mes') d.setMonth(d.getMonth() - 1);
    else d.setFullYear(d.getFullYear() - 1);
    cursor = d; render(); toast('◀ Cambiaste de ' + (view === 'ano' ? 'año' : view));
  });
  $('dNext').addEventListener('click', function(){
    var d = new Date(cursor);
    if (view === 'dia') d.setDate(d.getDate() + 1);
    else if (view === 'semana') d.setDate(d.getDate() + 7);
    else if (view === 'mes') d.setMonth(d.getMonth() + 1);
    else d.setFullYear(d.getFullYear() + 1);
    cursor = d; render(); toast('▶ Cambiaste de ' + (view === 'ano' ? 'año' : view));
  });
  $('calTodayBtn').addEventListener('click', function(){
    cursor = parseISO(TODAY);
    if (view !== 'mes') setView('mes'); else render();
    toast('📅 Volviste a hoy');
  });
  var dateInput = $('dDate');
  dateInput.value = iso(cursor);
  dateInput.addEventListener('change', function(){
    if (!dateInput.value) return;
    cursor = parseISO(dateInput.value);
    if (view === 'mes') cursor.setDate(cursor.getDate()); // keep day
    render(); toast('📅 Fecha cambiada');
  });

  /* ---------- cerrar sesión ---------- */
  var btnLogout = $('btnLogout');
  if (btnLogout) btnLogout.addEventListener('click', function(e){
    e.preventDefault();
    var target = (location.protocol === 'file:')
      ? '../selecci_n_de_rol_distribuci_n_expandida_vertical/code.html'
      : '/seleccion-rol';
    window.location.assign(target);
  });

  /* ---------- init ---------- */
  render();
})();
</script>
</body>
