[build]
  command = "npm install"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express", "@supabase/supabase-js", "dotenv", "serverless-http", "bcryptjs"]
  included_files = [
    "bienvenido_a_horasocial_pro_1/**",
    "selecci_n_de_rol_distribuci_n_expandida_vertical/**",
    "stitch_horasocial_pro_landing_page/login_estudiante_distribuci_n_centrada_y_logo_optimizado_2/**",
    "stitch_horasocial_pro_landing_page/recuperar_contrasena_estudiante/**",
    "stitch_horasocial_pro_landing_page/sobre_horasocial_pro_identidad_y_prop_sito/**",
    "dashboard_estudiante_horasocial_pro/**",
    "agenda_estudiante_horasocial_pro/**",
    "registro_estudiante_horasocial_pro/**",
    "mensajes_estudiante_horasocial_pro/**",
    "chat_maestro_estudiante_horasocial_pro/**",
    "dashboard_maestro_horasocial_pro/**",
    "gestion_estudiantes_maestro_horasocial_pro/**",
    "gestion_tecnica_maestro_horasocial_pro/**",
    "mensajes_maestro_horasocial_pro/**",
    "chat_maestro_horasocial_pro/**",
    "login_maestro_horasocial_pro/**",
    "recuperar_contrasena_maestro_horasocial_pro/**",
    "login_administrador_horasocial_pro/**",
    "dashboard_administrador_horasocial_pro/**",
    "stitch_horasocial_pro_landing_page/coordinaci_n_y_ajuste_de_docentes_admin/**",
    "stitch_horasocial_pro_landing_page/control_de_estudiantes_y_alertas_admin_versi_n_corregida/**",
    "stitch_horasocial_pro_landing_page/mensajer_a_y_canales_admin_horasocial_pro_2/**",
    "recuperar_contrasena_administrador_horasocial_pro/**",
    "signup_estudiante_horasocial_pro/**",
    "signup_maestro_horasocial_pro/**",
    "signup_administrador_horasocial_pro/**",
    "assets/**",
    "recuperaciones_materias.json",
    "design.css",
    "responsive.css",
    "new-user.js",
    "index.html",
    "_redirects"
  ]

# API always runs through Express
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200
  force = true

# Direct static routes for instant loading without function cold starts
[[redirects]]
  from = "/maestro/estudiantes"
  to = "/gestion_estudiantes_maestro_horasocial_pro/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/maestro/dashboard"
  to = "/dashboard_maestro_horasocial_pro/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/estudiante/dashboard"
  to = "/dashboard_estudiante_horasocial_pro/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/estudiante/recuperaciones"
  to = "/dashboard_estudiante_horasocial_pro/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/estudiante/agenda"
  to = "/agenda_estudiante_horasocial_pro/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/estudiante/registro"
  to = "/registro_estudiante_horasocial_pro/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/estudiante/mensajes"
  to = "/mensajes_estudiante_horasocial_pro/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/dashboard"
  to = "/dashboard_administrador_horasocial_pro/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/alertas"
  to = "/stitch_horasocial_pro_landing_page/control_de_estudiantes_y_alertas_admin_versi_n_corregida/code.html"
  status = 200
  force = true

[[redirects]]
  from = "/seleccion-rol"
  to = "/selecci_n_de_rol_distribuci_n_expandida_vertical/code.html"
  status = 200
  force = true

[[redirects]]
  from = "/login"
  to = "/stitch_horasocial_pro_landing_page/login_estudiante_distribuci_n_centrada_y_logo_optimizado_2/code.html"
  status = 200
  force = true

[[redirects]]
  from = "/profesor/login"
  to = "/login_maestro_horasocial_pro/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/login"
  to = "/login_administrador_horasocial_pro/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/demo"
  to = "/dashboard_estudiante_horasocial_pro/index.html"
  status = 200
  force = true

# Fallback for remaining dynamic requests
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
