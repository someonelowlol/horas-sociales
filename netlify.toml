# Netlify single-deploy setup (Option A): the existing Express app runs inside
# a Netlify Function, so pages, statics and /api/* are served together.
[build]
  command = "npm install"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # No engines field in package.json; pin the Functions runtime to Node 20 (LTS).
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express", "@supabase/supabase-js", "dotenv", "serverless-http"]
  # Bundle every screen folder plus the shared assets so STATIC_ROOT can
  # serve them from the deployed bundle root (/var/task). Each glob below
  # was verified against the repo filesystem — no orphan entries.
  included_files = [
    "bienvenido_a_horasocial_pro_1/**",
    "selecci_n_de_rol_distribuci_n_expandida_vertical/**",
    "stitch_horasocial_pro_landing_page/login_estudiante_distribuci_n_centrada_y_logo_optimizado_2/**",
    "stitch_horasocial_pro_landing_page/recuperar_contrasena_estudiante/**",
    "stitch_horasocial_pro_landing_page/sobre_horasocial_pro_identidad_y_prop_sito/**",
    "dashboard_estudiante_horasocial_pro/**",
    "agenda_estudiante_horasocial_pro/**",
    "registro_estudiante_horasocial_pro/**",
    "mensajes_estudiante_horasocial_pro/**",
    "chat_maestro_estudiante_horasocial_pro/**",
    "dashboard_maestro_horasocial_pro/**",
    "gestion_estudiantes_maestro_horasocial_pro/**",
    "gestion_tecnica_maestro_horasocial_pro/**",
    "mensajes_maestro_horasocial_pro/**",
    "chat_maestro_horasocial_pro/**",
    "login_maestro_horasocial_pro/**",
    "recuperar_contrasena_maestro_horasocial_pro/**",
    "login_administrador_horasocial_pro/**",
    "dashboard_administrador_horasocial_pro/**",
    "stitch_horasocial_pro_landing_page/coordinaci_n_y_ajuste_de_docentes_admin/**",
    "stitch_horasocial_pro_landing_page/control_de_estudiantes_y_alertas_admin_versi_n_corregida/**",
    "stitch_horasocial_pro_landing_page/mensajer_a_y_canales_admin_horasocial_pro_2/**",
    "recuperar_contrasena_administrador_horasocial_pro/**",
    "design.css",
    "responsive.css",
    "new-user.js",
    "index.html"
  ]

# API always runs through Express, never as static files.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200
  force = true

# Landing must serve the PRO reference page from Express (bienvenido), not the
# orphan index.html that Netlify would otherwise serve statically at /.
[[redirects]]
  from = "/"
  to = "/.netlify/functions/server"
  status = 200
  force = true

# Every other page has no static file, so it falls through to Express.
# Existing static assets (design.css, responsive.css, screen folders) are still
# served directly by the CDN; Express also serves them as a fallback.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
