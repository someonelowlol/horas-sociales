<!DOCTYPE html>
<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HORASOCIAL PRO - Crear cuenta: estudiantes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    :root {
      --institutional: #0F172A;
      --sky: #38BDF8;
      --sky-dark: #0EA5E9;
      --surface: #FFFFFF;
      --muted: #45464D;
      --muted-soft: #6B7280;
      --line: #D1D7E2;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      color: var(--institutional);
      background: var(--surface);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      user-select: none;
    }
    header, main, footer { position: relative; z-index: 1; }
    .site-header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 32px;
    }
    .site-header .logo {
      height: 120px;
      width: auto;
      object-fit: contain;
      border: 1.5px solid rgba(15, 23, 42, 0.75);
      border-radius: 14px;
      padding: 8px;
      background: #fff;
      margin-bottom: 20px;
    }
    .slogan {
      text-align: center;
      padding: 0 16px;
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 20px;
      line-height: 1.4;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .slogan .line-1 { color: var(--institutional); }
    .slogan .line-2 { color: var(--sky); }
    .login-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border: 1px solid rgba(209, 215, 226, 0.9);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
      padding: 32px;
      text-align: center;
    }
    .login-card h1 {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 24px;
      line-height: 1.3;
      font-weight: 700;
      color: var(--institutional);
      margin-bottom: 24px;
    }
    .login-card h1 .rol { color: var(--sky); }
    .field { margin-bottom: 20px; text-align: left; }
    .field label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .input-wrap { position: relative; display: flex; align-items: center; }
    .input-wrap .icon {
      position: absolute;
      left: 14px;
      color: var(--muted-soft);
      font-size: 20px;
      pointer-events: none;
    }
    .input-wrap input {
      width: 100%;
      padding: 14px 44px 14px 46px;
      font-size: 15px;
      font-family: "Inter", sans-serif;
      color: var(--institutional);
      background: #F8FAFC;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .input-wrap input::placeholder { color: rgba(107, 114, 128, 0.7); }
    .input-wrap input:focus {
      border-color: var(--sky);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
    }
    .input-wrap .eye {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted-soft);
      font-size: 20px;
      display: flex;
      align-items: center;
      padding: 4px;
    }
    .input-wrap .eye:hover { color: var(--sky); }
    .btn-ingresar {
      width: 100%;
      padding: 14px;
      font-family: "Inter", sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
      background: var(--sky);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.35);
      transition: background .2s ease, transform .15s ease, box-shadow .2s ease;
    }
    .btn-ingresar:hover { background: var(--sky-dark); box-shadow: 0 4px 12px rgba(56, 189, 248, 0.45); }
    .btn-ingresar:active { transform: scale(0.98); }
    .btn-ingresar:disabled { opacity: 0.6; cursor: wait; }
    /* Server-side duplicate / validation error shown in Spanish. */
    .hs-error {
      display: none;
      margin-top: 14px;
      font-size: 13px;
      font-weight: 600;
      color: #B91C1C;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 10px;
      padding: 10px 12px;
    }
    .hs-error.show { display: block; }
    .forgot {
      display: inline-block;
      margin-top: 18px;
      font-size: 12px;
      font-weight: 600;
      color: var(--sky);
      text-decoration: none;
    }
    .forgot:hover { text-decoration: underline; }
    .site-footer {
      width: 100%;
      padding: 20px 32px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .site-footer .copy { font-size: 12px; font-weight: 600; color: var(--muted-soft); }
    .site-footer nav { display: flex; gap: 20px; }
    .site-footer nav a { font-size: 12px; font-weight: 600; color: var(--muted-soft); text-decoration: none; }
    .site-footer nav a:hover { color: var(--sky); }
    @media (max-width: 640px) {
      .site-header { padding-top: 20px; }
      .site-header .logo { height: 96px; }
      .login-card { padding: 24px 18px; }
      .site-footer { justify-content: center; }
    }
</style>
  <link rel="stylesheet" href="/design.css">
  <link rel="stylesheet" href="/responsive.css">
</head>
<body>
<header class="site-header">
<img class="logo" alt="HORASOCIAL PRO Logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBl0_W9o0isr1E81a1ecAaftLUFNSxWfoq4b2vQUpjiQJIGuEArx0ORA6uZeLxm4VwWZWYbxI31qfhIPVKxaidEz7wwBHPuS5AOaWO7vHr7LoOOcO_UVoMvFFWEAcllJ_HhnLwIEaJKAcEkGB9P7PVxfsnjDl_Xv6BUMooxWANxcRFdtFaOBVbxtyECYSl3ZkLhzSTsfzEfCBZUmL1g3hVO8rUpNIAMSP5j-a4s1waL7ePWk4Ia51DIBDexIXSwj2bjEfDFejB0NrOU"/>
<p class="slogan">
<span class="line-1">Formando líderes.</span>
<span class="line-2">Trackeando tu impacto.</span>
</p>
</header>

<main class="login-wrap">
<div class="login-card">
<h1>Crear cuenta: <span class="rol">estudiantes</span></h1>

<form id="signupForm" action="/api/signup-estudiante" method="post" autocomplete="on">
<div class="field">
<label for="username">Código o correo electrónico</label>
<div class="input-wrap">
<span class="material-symbols-outlined icon">person</span>
<input id="username" name="usuario" type="text" placeholder="Código o correo electrónico" autocomplete="username" required/>
</div>
</div>

<div class="field">
<label for="fullname">Nombre completo</label>
<div class="input-wrap">
<span class="material-symbols-outlined icon">badge</span>
<input id="fullname" name="nombre" type="text" placeholder="Nombre completo" autocomplete="name" required/>
</div>
</div>

<div class="field">
<label for="password">Contraseña</label>
<div class="input-wrap">
<span class="material-symbols-outlined icon">lock</span>
<input id="password" name="password" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" minlength="6" required/>
<button class="eye" type="button" onclick="togglePassword()" aria-label="Mostrar u ocultar contraseña">
<span class="material-symbols-outlined" id="eyeIcon">visibility</span>
</button>
</div>
</div>

<button class="btn-ingresar" type="submit" id="signupBtn">CREAR CUENTA</button>
<p class="hs-error" id="signupError" role="alert"></p>
</form>

<a class="forgot" id="loginLink" href="/login">¿Ya tienes cuenta? Inicia sesión</a>
</div>
</main>

<footer class="site-footer">
<span class="copy">© 2024 Horasocial Pro. Professional Social Service Management.</span>
<nav>
<a href="#">Privacidad</a>
<a href="#">Soporte</a>
<a href="#">Términos</a>
</nav>
</footer>

<script>
function togglePassword() {
  const input = document.getElementById('password');
  const icon = document.getElementById('eyeIcon');
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  icon.textContent = show ? 'visibility_off' : 'visibility';
}

// Signup via fetch: the API checks the database first. A 409 means the
// username is taken ("usuario ya registrado"); a 201 returns the fresh-user
// dashboard redirect (?new=1, rendered by new-user.js).
document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('signupBtn');
  const err = document.getElementById('signupError');
  err.classList.remove('show');
  btn.disabled = true;
  const payload = {
    usuario: document.getElementById('username').value.trim(),
    nombre: document.getElementById('fullname').value.trim(),
    password: document.getElementById('password').value
  };
  try {
    const res = await fetch('/api/signup-estudiante', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload)
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      err.textContent = body.error || 'No se pudo crear la cuenta';
      err.classList.add('show');
      return;
    }
    try {
      localStorage.setItem('horasocial_has_account', '1');
      localStorage.setItem('horasocial_new_user', '1');
    } catch (storeErr) {}
    window.location.href = body.redirect || '/estudiante/dashboard?new=1';
  } catch (netErr) {
    err.textContent = 'Sin conexión con el servidor';
    err.classList.add('show');
  } finally {
    btn.disabled = false;
  }
});

if (location.protocol === 'file:') {
  document.getElementById('loginLink').href = '../stitch_horasocial_pro_landing_page/login_estudiante_distribuci_n_centrada_y_logo_optimizado_2/code.html';
}
</script>
</body></html>
